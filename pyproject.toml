[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crashfixture"
version = "0.1.0"
description = "Witnessed subprocess crash/restart fixtures for synthetic recovery tests"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "crashfixture contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
crashfixture = "crashfixture.cli:main"

[project.entry-points.pytest11]
crashfixture = "crashfixture.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["artifacts", "crashfixture-artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
