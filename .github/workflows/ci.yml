name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/verify.py
      - run: python -m pip install --force-reinstall --no-index --no-deps dist/*.whl
      - run: python scripts/check_onboarding.py --python "$(python -c 'import sys; print(sys.executable)')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/pytest.xml
            artifacts/onboarding
          if-no-files-found: error
